specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Hamilton Lane
providerId: hamilton-lane
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Private Markets
  - Asset Management
  - Investment
  - Rate Limiting
  - Quotas
  - Throttling
description: Hamilton Lane does not publish a public API rate-limit document. API access is part
  of an institutional Cobalt subscription, with throttling configured per subscriber.
notes: No public rate-limit documentation could be located.
sources:
  - https://www.hamiltonlane.com/en-us
headers:
  retryAfter: Retry-After
responseCodes:
  throttled: 429
  serviceUnavailable: 503
limits:
  - tier: enterprise
    name: Contract-defined per-subscriber limit
    scope: subscriber
    metric: varies
    limit: see Cobalt subscription agreement
    applies:
      - Hamilton Lane API
policies:
  - name: Backoff Strategy
    description: Honor Retry-After on 429; back off with exponential jitter on transient 5xx.
  - name: Subscriber Scoping
    description: Limits are enforced per Cobalt subscriber; raises require working with the
      Hamilton Lane / Cobalt account team.
  - name: Fair Use
    description: Sustained traffic above contracted volumes may be throttled.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
