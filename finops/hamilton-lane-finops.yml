principles:
  - name: Visibility
    description: Track Cobalt seat utilization and API call volume via the Cobalt admin console.
  - name: Allocation
    description: Allocate Cobalt subscription cost across investment teams (private equity,
      private credit, real assets, infrastructure) using seat assignments.
  - name: Optimization
    description: Right-size seat counts; consolidate API consumption through a central data team
      rather than per-analyst direct calls.
  - name: Accountability
    description: Designate a Cobalt program owner; review seat utilization and renewal terms
      annually.
